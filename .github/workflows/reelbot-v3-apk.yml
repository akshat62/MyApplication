name: Diagnose ReelBot V3 Startup
on:
  push:
    branches: [ master ]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reelbot-v3-build-20260909
      - name: Inspect startup source
        run: |
          cat reelbot-v3-upload/source.part*.b64 > /tmp/reelbot-v3.b64
          base64 -d /tmp/reelbot-v3.b64 > /tmp/ReelBot-V3-scaffold-source.zip
          rm -rf /tmp/v3 && mkdir -p /tmp/v3
          unzip -q /tmp/ReelBot-V3-scaffold-source.zip -d /tmp/v3
          if [ -d reelbot-v3-overrides ]; then cp -a reelbot-v3-overrides/. /tmp/v3/ReelBotV3/; fi
          echo '===== AndroidManifest.xml ====='
          cat /tmp/v3/ReelBotV3/app/src/main/AndroidManifest.xml
          echo '===== ReelBotApp.kt ====='
          grep -R -n -A100 -B20 'class ReelBotApp' /tmp/v3/ReelBotV3/app/src/main/java || true
          echo '===== App-wide loadLibrary references ====='
          grep -R -n 'System.loadLibrary\|loadLibrary(' /tmp/v3/ReelBotV3/app/src/main/java || true
          echo '===== App startup constructors ====='
          grep -R -n 'Room.databaseBuilder\|ReelBotDatabase\|ReelRepository(' /tmp/v3/ReelBotV3/app/src/main/java || true
          exit 1
