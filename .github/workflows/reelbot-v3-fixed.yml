name: ReelBot V3 build and device tests
on:
  push:
    branches: [reelbot-v3-fixed-20260913]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cancel superseded verification runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --workflow reelbot-v3-fixed.yml --status in_progress --json databaseId --jq '.[].databaseId' | while read -r run_id; do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"; fi
          done
      - name: Reconstruct existing V3 source with fixes
        run: |
          python - <<'PY'
          import base64,io,pathlib,zipfile,shutil
          p=pathlib.Path('reelbot-v3-upload')
          z=zipfile.ZipFile(io.BytesIO(base64.b64decode(''.join(f.read_text() for f in sorted(p.glob('source.part*.b64'))))))
          z.extractall('build-source')
          shutil.copytree('reelbot-v3-overrides','build-source/ReelBotV3',dirs_exist_ok=True)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare native build
        working-directory: build-source/ReelBotV3
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;34.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          git clone --depth 1 --branch v1.7.2 https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whisper.cpp
      - name: Compile APK and tests
        working-directory: build-source/ReelBotV3
        run: gradle clean assembleDebug assembleDebugAndroidTest testDebugUnitTest --no-daemon
      - name: Install video test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg ripgrep
      - name: Prepare real speech fixture
        working-directory: build-source/ReelBotV3
        run: bash scripts/prepare-test-input.sh
      - name: Allow Android hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 35
          arch: x86_64
          working-directory: build-source/ReelBotV3
          script: bash scripts/device-tests.sh
      - name: Package corrected APK and complete source
        if: always()
        run: |
          mkdir -p deliverables
          cp build-source/ReelBotV3/app/build/outputs/apk/debug/app-debug.apk deliverables/ReelBot-V3-Fixed.apk
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('build-source/ReelBotV3')
          excluded={'.git','.gradle','.cxx','build','.idea','test-input','test-results'}
          with zipfile.ZipFile('deliverables/ReelBot-V3-Corrected-Source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in root.rglob('*'):
              rel=p.relative_to(root)
              if p.is_file() and not excluded.intersection(rel.parts) and p.name not in {'local.properties','README.md','SETUP.md'}:
                z.write(p,Path('ReelBotV3')/('README.md' if p.name == 'README_FIXED.md' else rel))
          PY
      - name: Collect test evidence and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReelBot-V3-build-and-test-evidence
          path: |
            deliverables/
            build-source/ReelBotV3/app/build/outputs/apk/
            build-source/ReelBotV3/app/build/reports/
            build-source/ReelBotV3/test-results/
