name: Package verified ReelBot deliverables
on:
  push:
    branches: [reelbot-v3-diagnostics-20260913]
permissions:
  contents: read
  actions: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reelbot-v3-fixed-20260913
      - name: Assemble verified deliverables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 34748502463 --repo "$GITHUB_REPOSITORY" || true
          gh run download 34747988107 --repo "$GITHUB_REPOSITORY" --dir core
          gh run download 34748943778 --repo "$GITHUB_REPOSITORY" --dir focused
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          out=Path('deliverables')
          out.mkdir()
          shutil.copyfile(next(Path('core').rglob('ReelBot-V3-Fixed.apk')),out/'ReelBot-V3-Fixed.apk')
          with zipfile.ZipFile(next(Path('core').rglob('ReelBot-V3-Corrected-Source.zip'))) as z:
            z.extractall('complete-source')
          project=Path('complete-source/ReelBotV3')
          shutil.copytree('reelbot-v3-overrides',project,dirs_exist_ok=True)
          shutil.copyfile('REELBOT_V3_TEST_REPORT.md',project/'TEST_REPORT.md')
          shutil.copyfile(project/'README_FIXED.md',project/'README.md')
          (project/'SETUP.md').unlink(missing_ok=True)
          with zipfile.ZipFile(out/'ReelBot-V3-Corrected-Source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in project.rglob('*'):
              if p.is_file(): z.write(p,p.relative_to(project.parent))
          shutil.copyfile('REELBOT_V3_TEST_REPORT.md',out/'TEST_REPORT.md')
          evidence=out/'evidence'
          evidence.mkdir()
          for root,label in [(Path('core'),'pipeline'),(Path('focused'),'playback-face')]:
            for d in root.rglob('test-results'):
              if d.is_dir(): shutil.copytree(d,evidence/label,dirs_exist_ok=True)
          # Focused artifact's root can itself be the test-results contents.
          for p in Path('focused').rglob('android-playback.txt'):
            shutil.copytree(p.parent,evidence/'playback-face',dirs_exist_ok=True)
          PY
          sha256sum deliverables/ReelBot-V3-Fixed.apk deliverables/ReelBot-V3-Corrected-Source.zip | tee deliverables/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ReelBot-V3-Fixed-APK
          path: |
            deliverables/ReelBot-V3-Fixed.apk
            deliverables/TEST_REPORT.md
            deliverables/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ReelBot-V3-Corrected-Source
          path: deliverables/ReelBot-V3-Corrected-Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ReelBot-V3-Test-Evidence
          path: deliverables/evidence/
