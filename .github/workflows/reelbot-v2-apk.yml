name: Build ReelBot APK
on:
  pull_request:
    branches: [ master ]
    paths:
      - 'reelbot-v2/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK
        run: gradle -p reelbot-v2 :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -s reelbot-v2/app/build/outputs/apk/debug/app-debug.apk
          sha256sum reelbot-v2/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ReelBot-Mobile-V2-debug
          path: reelbot-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
